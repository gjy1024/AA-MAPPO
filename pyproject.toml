[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-mappo-research"
version = "0.2.0"
description = "Maintained entity-attention MAPPO reference implementation and research evidence explorer"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3", "torch>=2.4,<3"]

[project.urls]
Repository = "https://github.com/gjy1024/AA-MAPPO"
Paper = "https://doi.org/10.1109/ICCECT68671.2026.11565262"

[tool.setuptools.packages.find]
include = ["aamappo*"]

[tool.setuptools.package-data]
aamappo = ["*.json"]
